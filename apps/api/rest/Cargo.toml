[package]
name = "rest"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = { version = "4.14.0", default-features = false, features = [
    "macros"
] }
actix-multipart = "0.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sea-orm = "2.0.0-rc"
jsonwebtoken = "9"
chrono = "0.4.45"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
log = "0.4"
apistos = { version = "0.6", features = ["extras", "scalar"] }
schemars = { package = "apistos-schemars", version = "0.8", features = ["chrono", "uuid"] }
aws-config = "1"
aws-sdk-s3 = "1"
uuid = { version = "1.23.5", features = ["v4"] }
db = { path = "../db" }
num-traits = "0.2"
urlencoding = "2.1.3"

[dev-dependencies]
actix-rt = "2"
tokio = { version = "1", features = ["macros", "rt"] }
