[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.14.0"
dotenvy = "0.15.7"
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.23.5", features = ["v4"] }
chrono = "0.4.45"
sea-orm = "2.0.0-rc"

apistos = { version = "0.6", features = ["scalar"] }
actix-cors = "0.7.0"
rest = { path = "rest" }
db = { path = "db" }
