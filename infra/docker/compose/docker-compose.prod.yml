name: school-lms-prod
services:
  postgres:
    image: postgres:17
    container_name: school-lms-postgres-prod
    restart: unless-stopped
    env_file:
      - ../../../apps/api/.env.production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../../apps/api
      dockerfile: ../../infra/docker/api/Dockerfile.prod
    restart: always
    ports:
      - "3001:3001"
    environment:
      - RUST_LOG=info
    env_file:
      - ../../../apps/api/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lms-network

  web:
    build:
      context: ../../../apps/web
      dockerfile: ../../infra/docker/web/Dockerfile.prod
    restart: always
    ports:
      - "3000:3000"
    networks:
      - lms-network

volumes:
  postgres_data:

networks:
  lms-network:
