services:

  api:
    build:
      context: ../../../apps/api
      dockerfile: ../../infra/docker/api/Dockerfile.dev
    container_name: lms-api-dev
    ports:
      - "3001:3001"
    volumes:
      - ../../../apps/api:/app
      - cargo-cache:/usr/local/cargo/registry
    environment:
      RUST_LOG: debug
    networks:
      - lms-network

  web:
    build:
      context: ../../../apps/web
      dockerfile: ../../infra/docker/web/Dockerfile.dev
    container_name: lms-web-dev
    ports:
      - "3000:3000"
    volumes:
      - ../../../apps/web:/app
      - /app/node_modules
      - bun-cache:/root/.bun
    depends_on:
      - api
    networks:
      - lms-network

networks:

  lms-network:

volumes:

  cargo-cache:
  bun-cache:
