name: school-lms-dev
services:
  postgres:
    image: postgres:17
    container_name: school-lms-postgres-dev
    restart: unless-stopped

    env_file:
      - ../../../apps/api/.env.local

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
