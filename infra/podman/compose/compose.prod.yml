name: school-lms-prod
services:
  postgres:
    image: postgres:17
    container_name: school-lms-postgres-prod
    restart: unless-stopped
    env_file:
      - ../../../apps/api/.env.production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: school-lms-minio-prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms-network

  minio-setup:
    image: minio/mc:latest
    container_name: school-lms-minio-setup-prod
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY;
      mc mb --ignore-existing local/school-lms;
      mc anonymous set download local/school-lms;
      exit 0;
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    networks:
      - lms-network

  api:
    build:
      context: ../../../apps/api
      dockerfile: ../../infra/podman/api/Containerfile.prod
    restart: always
    ports:
      - "8001:8001"
    environment:
      - RUST_LOG=info
    env_file:
      - ../../../apps/api/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - lms-network

  web:
    build:
      context: ../../../apps/web
      dockerfile: ../../infra/podman/web/Containerfile.prod
    restart: always
    ports:
      - "8000:8000"
    networks:
      - lms-network

  ngrok:
    image: ngrok/ngrok:latest
    container_name: school-lms-ngrok-prod
    restart: unless-stopped
    command: "http web:8000"
    ports:
      - "4040:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      - web
    networks:
      - lms-network
    profiles:
      - tunnel

volumes:
  postgres_data:
  minio_data:

networks:
  lms-network:
